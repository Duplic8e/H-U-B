name: Ledger checks

# Ledger's full quality gate: eslint, the unit suite, a production build, the
# three bundle and type-scale guards, and the Playwright browser suite across
# five viewport projects. It runs whenever Ledger changes. It does not block
# the deploy, which runs Ledger's unit tests on its own.
on:
  push:
    branches: [main]
    paths: ['apps/ledger/**', '.github/workflows/ledger-checks.yml']
  pull_request:
    paths: ['apps/ledger/**', '.github/workflows/ledger-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ledger

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/ledger/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both engines: the mobile-narrow and mobile-landscape projects emulate
      # an iPhone, whose default browser is webkit.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify
        run: npm run verify

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/ledger/test-results/
          if-no-files-found: ignore
          retention-days: 7
