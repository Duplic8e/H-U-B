name: Build and deploy the Hub

# Every app lives in this repo and is served as one site:
#   /H-U-B/          the Hub        (repo root)
#   /H-U-B/ledger/   Ledger         (apps/ledger)
#   /H-U-B/torque/   Torque         (apps/torque)
#   /H-U-B/lift/     Lift           (apps/lift)
#   /H-U-B/french/   French         (apps/french)
#   /H-U-B/pantry/   Pantry         (apps/pantry)
# Each app's unit tests run before anything deploys. Ledger's full checks
# (lint, browser tests) run separately in ledger-checks.yml.
#
# Pantry's built-in barcode copy (/H-U-B/pantry/barcodes/) is built from the Open Food Facts and USDA
# downloads once a week and cached in between, so most deploys reuse it.
on:
  push:
    branches: [main]
  # Mondays: rebuild Pantry's barcode copy from that week's downloads.
  schedule:
    - cron: '23 7 * * 1'
  # Actions tab → "Build and deploy the Hub" → Run workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_BASE: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/ledger/package-lock.json
            apps/torque/package-lock.json
            apps/lift/package-lock.json
            apps/french/package-lock.json
            apps/pantry/package-lock.json

      - name: Hub
        run: npm ci && npm test && npm run build
        env:
          BASE_PATH: ${{ env.SITE_BASE }}

      - name: Ledger
        working-directory: apps/ledger
        run: npm ci && npm test -- --run && npm run build
        env:
          BASE_PATH: ${{ env.SITE_BASE }}ledger/
          VITE_HUB_URL: ${{ env.SITE_BASE }}

      - name: Torque
        working-directory: apps/torque
        run: npm ci && npm test && npm run build
        env:
          BASE_PATH: ${{ env.SITE_BASE }}torque/
          VITE_HUB_URL: ${{ env.SITE_BASE }}

      - name: Lift
        working-directory: apps/lift
        run: npm ci && npm test && npm run build
        env:
          BASE_PATH: ${{ env.SITE_BASE }}lift/
          VITE_HUB_URL: ${{ env.SITE_BASE }}

      - name: French
        working-directory: apps/french
        run: npm ci && npm test && npm run build
        env:
          BASE_PATH: ${{ env.SITE_BASE }}french/
          VITE_HUB_URL: ${{ env.SITE_BASE }}

      - name: Pantry
        working-directory: apps/pantry
        run: npm ci && npm test && npm run build
        env:
          BASE_PATH: ${{ env.SITE_BASE }}pantry/
          VITE_HUB_URL: ${{ env.SITE_BASE }}

      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Pantry's barcode copy
        id: catalog
        uses: actions/cache@v4
        with:
          path: apps/pantry/catalog
          key: pantry-catalog-${{ steps.week.outputs.week }}-${{ hashFiles('apps/pantry/scripts/build-catalog.mjs', 'apps/pantry/scripts/fetch-catalog.sh', 'apps/pantry/src/data/categories.json') }}

      # About 2 GB of downloads and 5 minutes. If it fails, Pantry deploys without the copy and its
      # scans use the online databases only; Settings says so.
      - name: Build Pantry's barcode copy
        if: steps.catalog.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: apps/pantry
        run: bash scripts/fetch-catalog.sh "$RUNNER_TEMP/catalog-downloads" catalog

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R dist/. site/
          cp -R apps/ledger/dist site/ledger
          cp -R apps/torque/dist site/torque
          cp -R apps/lift/dist site/lift
          cp -R apps/french/dist site/french
          cp -R apps/pantry/dist site/pantry
          if [ -f apps/pantry/catalog/meta.json ]; then cp -R apps/pantry/catalog site/pantry/barcodes
          else echo "::warning::Pantry's barcode copy is missing; this deploy leaves it out."; fi
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          reporting_interval: 15000
          error_count: 15
